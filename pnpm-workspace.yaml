packages:
  - apps/*
  - packages/*

allowBuilds:
  # core-js postinstall only prints a funding banner, so skipping it is correct.
  core-js: false
  esbuild: true

# Security floors for transitive copies.
# pnpm 11 reads overrides from here, not from package.json's "pnpm" field.
overrides:
  qs: ">=6.16.0"
  nodemailer: ">=10.0.6"
  linkify-it: ">=5.0.2"
  ip-address: ">=10.7.4"
  "fast-uri@4": ">=4.2.3"
  "fast-uri@3": ">=3.1.9"
  dompurify: ">=3.4.17"
  body-parser: ">=2.4.0"
  source-map-js: ">=1.2.2"
  vite: "^7.0.0"
