name: CLA

# Contributor License Agreement bot (CLA Assistant Lite). A contributor signs
# once by commenting the exact sentence below on their pull request; the
# signature is stored in signatures/v1/cla.json on the `cla-signatures` branch.
#
#
# SECURITY: pull_request_target runs in the context of the base repository with
# a write-capable token, so this workflow must NEVER check out, build or run
# code from the pull request. It has no checkout step and none may be added.
# The action only reads pull request metadata through the GitHub API and
# commits the signatures file.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write # writes the signatures file to the cla-signatures branch
  pull-requests: write
  statuses: write

jobs:
  cla:
    # Only the public repository runs this; the private ops repo and forks skip it.
    if: github.repository == 'inboxjoy/inboxjoy'
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/inboxjoy/inboxjoy/blob/main/.github/CLA.md
          path-to-signatures: signatures/v1/cla.json
          branch: cla-signatures
          allowlist: dependabot[bot],renovate[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            Thanks for your contribution. Before we can merge it, please sign the
            [Contributor License Agreement](https://github.com/inboxjoy/inboxjoy/blob/main/.github/CLA.md)
            (one time only) by replying below with the exact sentence in the box.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: All contributors have signed the CLA. Thank you.
          lock-pullrequest-aftermerge: false
