name: Feature request
description: Suggest an improvement or a new capability.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Start with the problem, not the solution. Small, well-scoped requests are
        the easiest to say yes to. For open-ended ideas, try
        [Discussions](https://github.com/inboxjoy/inboxjoy/discussions) first.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Who is affected and what is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Describe the behavior you have in mind. Sketches and examples help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to build it?
      options:
        - "Yes, I can open a pull request"
        - "Maybe, with some guidance"
        - "No, I am only suggesting it"
    validations:
      required: true
